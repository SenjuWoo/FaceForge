version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The npm manifest lives in the active snapshot, not the repo root.
  # Retarget this directory when CURRENT.txt moves.
  - package-ecosystem: npm
    directory: "/FaceForge 0.26.0/src/FaceForge.Web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # React refuses to start when react and react-dom differ (minified error 527, blank window), which
    # is exactly what two separate Dependabot PRs produce. They are bumped together or not at all.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
